<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Wordle</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f6e7f0;
    text-align: center;
    padding: 20px;
  }

  h1 {
    color: darkmagenta;
  }

  select, input, button {
    padding: 10px;
    font-size: 16px;
    margin: 5px;
  }

  button {
    cursor: pointer;
    background: darkmagenta;
    color: white;
    border: none;
    border-radius: 5px;
  }

  .board {
    margin-top: 20px;
  }

  .row {
    display: flex;
    justify-content: center;
    margin: 5px;
  }

  .tile {
    width: 45px;
    height: 45px;
    border: 2px solid #333;
    margin: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    background: white;
    text-transform: uppercase;
  }

  .correct {
    background: #4caf50;
    color: white;
  }

  .present {
    background: #ffc107;
    color: black;
  }

  .wrong {
    background: #cccccc;
    color: black;
  }

  #message {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>💍 Wedding Wordle</h1>
<p>Choose a difficulty and guess the wedding word!</p>

<select id="difficulty" onchange="startGame()">
  <option value="easy">Easy (3 letters)</option>
  <option value="medium" selected>Medium (5 letters)</option>
  <option value="hard">Hard (6 letters)</option>
</select>

<br>

<input type="text" id="guessInput">
<button onclick="submitGuess()">Guess</button>

<div class="board" id="board"></div>
<div id="message"></div>

<script>
  const words = {
    easy: ["JOY", "HUG", "LOVE"],
    medium: ["BRIDE", "GROOM", "AISLE", "VOWS", "RINGS"],
    hard: ["FLOWER", "DINNER", "CHAPEL", "KISSES"]
  };

  let answer = "";
  let wordLength = 5;
  let tries = 0;

  function startGame() {
    const difficulty = document.getElementById("difficulty").value;

    if (difficulty === "easy") {
      wordLength = 3;
    } else if (difficulty === "medium") {
      wordLength = 5;
    } else {
      wordLength = 6;
    }

    const wordList = words[difficulty];
    answer = wordList[Math.floor(Math.random() * wordList.length)];

    tries = 0;
    document.getElementById("board").innerHTML = "";
    document.getElementById("message").innerHTML = "";

    const input = document.getElementById("guessInput");
    input.value = "";
    input.maxLength = wordLength;
    input.placeholder = wordLength + "-letter word";
  }

  function submitGuess() {
    const input = document.getElementById("guessInput");
    const guess = input.value.toUpperCase();

    if (guess.length !== wordLength) {
      alert("Please enter a " + wordLength + "-letter word.");
      return;
    }

    if (tries >= 6) return;

    const row = document.createElement("div");
    row.className = "row";

    for (let i = 0; i < wordLength; i++) {
      const tile = document.createElement("div");
      tile.className = "tile";

      if (guess[i] === answer[i]) {
        tile.classList.add("correct");
      } else if (answer.includes(guess[i])) {
        tile.classList.add("present");
      } else {
        tile.classList.add("wrong");
      }

      tile.textContent = guess[i];
      row.appendChild(tile);
    }

    document.getElementById("board").appendChild(row);

    tries++;

    if (guess === answer) {
      document.getElementById("message").innerHTML =
        "🎉 You won! The word was " + answer;
    } else if (tries === 6) {
      document.getElementById("message").innerHTML =
        "💔 Game over! The word was " + answer;
    }

    input.value = "";
  }

  startGame();
</script>

</body>
</html>
